    <script>// Shared keybind helper — loaded first on every templated page (see
// templates/*.js for the load order). Single place for the guards every
// keydown handler needs: modifier keys, text-editing targets, and key
// normalization. Page scripts (photos.js, photo-single.js, plants.js,
// videos.js, home.js) and the global defaults (keybinds.js, loaded last)
// register via onKey() instead of raw addEventListener("keydown").
// Collection pages (photos, plants, tools) offer mouseless list nav via
// bindDigitNav().
//
// Ordering contract: page-specific handlers are registered before the
// global defaults (page assets come before keybinds.js in loadJs), so a
// page handler that preventDefaults an Escape press (e.g. clearing a
// non-empty search) runs first and the global up-nav skips via
// e.defaultPrevented. Works at build time (require) and in the browser
// (globals + UMD guard, mirroring month-utils.js).

function isEditableTarget(target) {
  return (
    target &&
    (target.tagName === "INPUT" ||
      target.tagName === "TEXTAREA" ||
      target.tagName === "SELECT" ||
      target.isContentEditable)
  );
}

function hasModifier(e) {
  return e.ctrlKey || e.metaKey || e.altKey;
}

// Normalize a key event to a lowercase match token: "Escape" → "escape",
// " " / "Spacebar" → "space", "Esc" → "escape". Falls back to keyCode for
// very old browsers (mirrors the photo-single.js fallback).
function normalizeKey(e) {
  const raw = (e.key || String.fromCharCode(e.keyCode || 0) || "").toLowerCase();
  if (raw === " " || raw === "spacebar") {
    return "space";
  }
  if (raw === "esc") {
    return "escape";
  }
  return raw;
}

// Register a keydown handler with shared guards. keys is a single key or
// an array of keys (post-normalization, e.g. "escape", "j", "/").
// By default handlers are skipped inside text-editing targets and when a
// modifier is held; pass { allowInEditable: true } for handlers like
// Enter-to-open-first that explicitly manage the focused-input case.
// No-ops without a document (build time). The handler owns
// preventDefault + navigation.
function onKey(keys, handler, opts = {}) {
  if (typeof document === "undefined") {
    return;
  }
  const wanted = Array.isArray(keys) ? keys : [keys];
  const allowInEditable = Boolean(opts.allowInEditable);
  document.addEventListener("keydown", (e) => {
    if (hasModifier(e)) {
      return;
    }
    if (!allowInEditable && isEditableTarget(e.target)) {
      return;
    }
    if (!wanted.includes(normalizeKey(e))) {
      return;
    }
    handler(e, normalizeKey(e));
  });
}

// Partial-visibility test: any part of the element inside the viewport.
// Zero-rect elements (display:none, e.g. collapsed plants subtrees) fail
// the bottom check and self-exclude. Used for SPACE play/pause targeting,
// where a mostly-visible player still counts.
function isInViewport(el) {
  if (typeof window === "undefined" || !el.getBoundingClientRect) {
    return false;
  }
  const rect = el.getBoundingClientRect();
  return (
    rect.bottom > 0 &&
    rect.top < window.innerHeight &&
    rect.right > 0 &&
    rect.left < window.innerWidth
  );
}

// Top-visibility test for nth-keybind candidates: the link's top edge must
// be on screen (never scrolled past), while running below the fold is fine.
// Horizontal containment still required. Zero-rect elements (display:none,
// e.g. collapsed plants subtrees) fail the bottom check and self-exclude.
function isFullyInViewport(el) {
  if (typeof window === "undefined" || !el.getBoundingClientRect) {
    return false;
  }
  const rect = el.getBoundingClientRect();
  return (
    rect.top >= 0 &&
    rect.left >= 0 &&
    rect.right <= window.innerWidth &&
    rect.bottom > 0
  );
}

// Mouseless list nav: "1"–"9" opens the nth top-visible link from
// getLinks(), a page-provided resolver returning candidate <a> elements in
// priority (DOM) order. Links scrolled past the top never bind; running
// below the fold is fine. Only ever targets the
// types (download buttons, toggles, photo links) are never hijacked.
// Hint titles "(n)" are managed here: originals are saved per link and
// restored when the link leaves the set. Base title is the link's own title,
// else its text (40 chars), else opts.label. Refreshes on scroll (passive,
// rAF-throttled) + resize + load; returns refresh() for manual calls after
// page re-renders (search). No-ops without a document (build time).
function bindDigitNav(getLinks, opts = {}) {
  if (typeof document === "undefined") {
    return () => {};
  }
  const label = opts.label || "Open link";
  const savedTitles = new WeakMap();
  let hinted = [];

  function baseTitle(link) {
    const current = link.getAttribute("title") || "";
    if (current && !/\(\d\)$/.test(current)) {
      return current;
    }
    const text = ((link.textContent || "").trim().slice(0, 40));
    return text || label;
  }

  function currentLinks() {
    return getLinks().filter(isFullyInViewport).slice(0, 9);
  }

  function refresh() {
    for (const link of hinted) {
      if (savedTitles.has(link)) {
        const original = savedTitles.get(link);
        if (original) {
          link.setAttribute("title", original);
        } else {
          link.removeAttribute("title");
        }
      }
    }
    hinted = currentLinks();
    hinted.forEach((link, i) => {
      if (!savedTitles.has(link)) {
        savedTitles.set(link, link.getAttribute("title"));
      }
      link.setAttribute("title", `${baseTitle(link)} (${i + 1})`);
    });
  }

  onKey(["1", "2", "3", "4", "5", "6", "7", "8", "9"], (e, key) => {
    const links = currentLinks();
    const link = links[Number(key) - 1];
    if (link) {
      e.preventDefault();
      window.location.href = link.href;
    }
  });

  let rafPending = false;
  function scheduleRefresh() {
    if (rafPending) {
      return;
    }
    rafPending = true;
    const raf = window.requestAnimationFrame || ((fn) => setTimeout(fn, 0));
    raf(() => {
      rafPending = false;
      refresh();
    });
  }
  document.addEventListener("scroll", scheduleRefresh, { passive: true });
  window.addEventListener("resize", scheduleRefresh);
  refresh();
  return refresh;
}

// ---------------------------------------------------------------------------
// Grid scroll memory for Esc returns. Esc-driven grid arrivals (single photo
// page → /photos/, single video page → /videos/) are full navigations that
// always land at top, so the return leg is bridged with per-tab one-shot
// state: grid pages persist scrollY at departure (pagehide), Esc handlers
// flag the return, and the grid load below consumes the flag once.
// Browser back/forward/reload are untouched (scrollRestoration stays auto) —
// restoration only ever fires on the Esc flag. Storage may throw (private
// mode), in which case everything degrades to current top-landing behavior.
// ---------------------------------------------------------------------------
function sessGet(key) {
  try {
    return window.sessionStorage.getItem(key);
  } catch (_err) {
    return null;
  }
}

function sessSet(key, value) {
  try {
    window.sessionStorage.setItem(key, value);
  } catch (_err) {
    // ignore — scroll memory is best-effort
  }
}

function sessDel(key) {
  try {
    window.sessionStorage.removeItem(key);
  } catch (_err) {
    // ignore — scroll memory is best-effort
  }
}

function gridPath() {
  return window.location.pathname || "/";
}

// Mark the next load of gridPath as an Esc return. Call immediately before
// navigating there so the flag can't go stale.
function flagEscReturn(gridPath) {
  sessSet(`esc-return:${gridPath}`, "1");
}

// Track scroll for the current grid page: persist at departure, and consume
// a pending Esc return (restore now via rAF, then re-apply on window load
// only if the user hasn't scrolled meanwhile — late image layout shifts must
// not yank a user who already moved). Call once per grid load; grids only.
function trackGridScroll() {
  if (typeof document === "undefined" || typeof window === "undefined") {
    return;
  }
  const path = gridPath();
  window.addEventListener("pagehide", () => {
    sessSet(`grid-scroll:${path}`, String(window.scrollY || 0));
  });
  if (!sessGet(`esc-return:${path}`)) {
    return;
  }
  sessDel(`esc-return:${path}`);
  const y = Number(sessGet(`grid-scroll:${path}`)) || 0;
  const raf = window.requestAnimationFrame || ((fn) => setTimeout(fn, 0));
  raf(() => {
    window.scrollTo(0, y);
    const settled = window.scrollY;
    window.addEventListener("load", () => {
      if (window.scrollY === settled) {
        window.scrollTo(0, y);
      }
    });
  });
}

if (typeof module !== "undefined") {
  module.exports = {
    isEditableTarget,
    hasModifier,
    normalizeKey,
    onKey,
    isInViewport,
    isFullyInViewport,
    bindDigitNav,
    flagEscReturn,
    trackGridScroll,
  };
}

// Expose as globals for concatenated browser scripts (loadJs joins files
// into one classic script, so top-level declarations are already shared;
// globalThis assignment mirrors month-utils.js for explicitness).
if (typeof globalThis !== "undefined") {
  globalThis.isEditableTarget = isEditableTarget;
  globalThis.hasModifier = hasModifier;
  globalThis.normalizeKey = normalizeKey;
  globalThis.onKey = onKey;
  globalThis.isInViewport = isInViewport;
  globalThis.isFullyInViewport = isFullyInViewport;
  globalThis.bindDigitNav = bindDigitNav;
  globalThis.flagEscReturn = flagEscReturn;
  globalThis.trackGridScroll = trackGridScroll;
}

// ---------------------------------------------------------------------------
// home.js — homepage-only keyboard shortcuts. Loaded only on / (see
// templates/home.js for the load order). Guards (modifiers, editable
// targets, key normalization) come from keybind-utils.js (loaded first):
//
//   v/o/p/t → sections, g/l/r/i → socials
// ---------------------------------------------------------------------------
(function () {
  if (typeof document === "undefined") {
    return;
  }

  function findInternalLink(section) {
    const links = Array.from(document.querySelectorAll("a[href]"));
    return (
      links.find((a) => {
        const raw = (a.getAttribute("href") || "").trim();
        const normalized = raw.replace(/^\/|\/$/g, "");
        return normalized === section;
      }) || null
    );
  }

  function findExternalLink(fragment) {
    const links = Array.from(document.querySelectorAll("a[href]"));
    return (
      links.find((a) => {
        const href = (a.getAttribute("href") || "").toLowerCase();
        return href.includes(fragment);
      }) || null
    );
  }

  function homepageLinkFor(key) {
    switch (key) {
      case "v":
        return findInternalLink("videos");
      case "o":
        return findInternalLink("photos");
      case "p":
        return findInternalLink("plants");
      case "t":
        return findInternalLink("tools");
      case "g":
        return findExternalLink("github.com");
      case "l":
        return findExternalLink("letterboxd.com");
      case "r":
        return findExternalLink("rateyourmusic.com");
      case "i":
        return findExternalLink("instagram.com");
      default:
        return null;
    }
  }

  // Homepage shortcut hints, applied at runtime like photo-single.js titles.
  function applyHomepageHints() {
    const labels = {
      v: "Videos",
      o: "Photos",
      p: "Plants",
      t: "Tools",
      g: "GitHub",
      l: "Letterboxd",
      r: "RYM",
      i: "Instagram",
    };
    for (const key of Object.keys(labels)) {
      const link = homepageLinkFor(key);
      if (!link) {
        continue;
      }
      const hint = `(${key.toUpperCase()})`;
      const current = link.getAttribute("title") || "";
      if (!current.includes(hint)) {
        const base = current.trim() || labels[key];
        link.setAttribute("title", `${base} ${hint}`);
      }
    }
  }
  applyHomepageHints();

  // Homepage section + social shortcuts.
  onKey(["v", "o", "p", "t", "g", "l", "r", "i"], (e, key) => {
    const link = homepageLinkFor(key);
    if (link) {
      e.preventDefault();
      window.location.href = link.href;
    }
  });
}());

// ---------------------------------------------------------------------------
// keybinds.js — global (page-agnostic) keyboard shortcuts. Loaded last on
// every templated page (see templates/*.js for the load order) so
// page-specific handlers registered via onKey() run first. Guards
// (modifiers, editable targets, key normalization) come from
// keybind-utils.js (loaded first); this file owns only global behavior:
//
//   Escape → up (section parent, else home)
//   j / k  → half-viewport scroll (except photo-single pages, which own j/k
//            for prev/next nav in photo-single.js, and the videos grid, which
//            owns j/k for prev/next video snap in videos.js)
//   (Homepage shortcuts live in home.js, loaded only on /.)
//
// Coexists with page handlers:
//   - photo-single.js owns Escape + j/k on /photos/<slug>/ (query-preserved
//     grid return + scoped prev/next), so this file stays inert there.
//   - videos.js owns j/k on /videos/ (prev/next video snap), so this file
//     stays inert there (single-video pages keep the half-viewport scroll).
//   - photos.js / plants.js own Escape when their search input has content
//     (clear semantics: they clear + preventDefault, registered before this
//     file so they run first on the same press). This file skips Escape when
//     the press was already consumed (defaultPrevented) or the focused search
//     still has content; an empty search (focused or not) navigates up.
// ---------------------------------------------------------------------------
(function () {
  if (typeof document === "undefined") {
    return;
  }

  function pathName() {
    return window.location.pathname || "/";
  }

  function isPhotoSinglePage() {
    return /^\/photos\/[^/]+\/?$/.test(pathName());
  }

  function isVideosGrid() {
    const p = pathName();
    return p === "/videos/" || p === "/videos/index.html";
  }

  // The grid search input the user is currently typing in, if any.
  function activeSearchInput() {
    const active = document.activeElement;
    if (
      active &&
      (active.id === "photo-search" || active.id === "plant-search")
    ) {
      return active;
    }
    return null;
  }

  // Resolve the Escape "up" target. Null means no-op (home, or a page whose
  // own script owns Escape).
  function upHref() {
    const p = pathName();
    if (p === "/" || p === "/index.html") {
      return null;
    }
    if (isPhotoSinglePage()) {
      return null;
    }
    if (/^\/videos\/[^/]+\/?$/.test(p)) {
      return "/videos/";
    }
    if (/^\/(videos|photos|plants|tools)\/?$/.test(p)) {
      return "/";
    }
    return "/";
  }

  // Hint the header link that Escape actually targets, mirroring the
  // runtime-applied "(K)"/"(Esc)" titles in photo-single.js.
  function applyEscHint() {
    const href = upHref();
    if (!href) {
      return;
    }
    const link = document.querySelector(`header a[href="${href}"]`);
    if (link && !/\(Esc\)/.test(link.getAttribute("title") || "")) {
      const base = (link.getAttribute("title") || "").trim();
      link.setAttribute("title", base ? `${base} (Esc)` : "Up (Esc)");
    }
  }
  applyEscHint();

  // Escape → up. allowInEditable because an empty focused search still
  // navigates up; a focused search with content belongs to the page
  // clear-handler (registered first), which preventDefaults the press.
  onKey(
    "escape",
    (e) => {
      // A grid clear-handler (photos.js / plants.js, registered first) clears
      // a non-empty search and preventDefaults the same press — never navigate
      // after that, or Esc-with-query would both clear and leave the page.
      if (e.defaultPrevented) {
        return;
      }
      const activeSearch = activeSearchInput();
      // Fallback when this file ever runs before the clear-handler: a focused
      // search that still has content belongs to the clearer, not to up-nav.
      if (activeSearch && activeSearch.value.trim()) {
        return;
      }
      if (!activeSearch && isEditableTarget(e.target)) {
        return;
      }
      const href = upHref();
      if (href) {
        e.preventDefault();
        // Flag grid returns so the grid restores scroll position on arrival.
        // Only /videos/ is a grid target here (photo singles own their Esc).
        if (href === "/videos/") {
          flagEscReturn(href);
        }
        window.location.href = href;
      }
    },
    { allowInEditable: true },
  );

  // Half-viewport scroll. Photo-single pages own j/k for prev/next, and the
  // videos grid owns j/k for prev/next video snap (videos.js) — both stay
  // inert here. Single-video pages keep the half-viewport scroll.
  onKey(["j", "k"], (e, key) => {
    if (isPhotoSinglePage() || isVideosGrid()) {
      return;
    }
    const delta = Math.round(window.innerHeight / 2);
    e.preventDefault();
    window.scrollBy(0, key === "j" ? delta : -delta);
  });
}());
</script>
