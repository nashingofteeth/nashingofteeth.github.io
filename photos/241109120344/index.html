    <script>// Month names and abbreviations derived from the locale formatter rather
// than hardcoded, so the long/short forms can't drift. Forcing "en-US"
// makes the output locale-independent. Works at build time (require) and
// in the browser (exposed as globals).

function monthName(index, format) {
  return new Date(Date.UTC(2000, index, 1))
    .toLocaleString("en-US", { month: format, timeZone: "UTC" });
}

const MONTH_NAMES = Array.from({ length: 12 }, (_, i) => monthName(i, "long"));
const MONTH_SHORT = Array.from({ length: 12 }, (_, i) => monthName(i, "short").toLowerCase());
const MONTH_NAMES_LOWER = MONTH_NAMES.map((m) => m.toLowerCase());
const MONTH_ALT = MONTH_SHORT.join("|");

if (typeof module !== "undefined") {
  module.exports = { monthName, MONTH_NAMES, MONTH_NAMES_LOWER, MONTH_SHORT, MONTH_ALT };
}

// Also expose as globals for browser scripts and Node modules that depend on
// them being in the global namespace.
if (typeof globalThis !== "undefined") {
  globalThis.MONTH_NAMES = MONTH_NAMES;
  globalThis.MONTH_NAMES_LOWER = MONTH_NAMES_LOWER;
  globalThis.MONTH_SHORT = MONTH_SHORT;
  globalThis.MONTH_ALT = MONTH_ALT;
}

// Shared client-side helpers for the site's search features (photos, plants,
// photo single page). All functions are runtime-safe: they only touch the DOM
// when a document is present. The UMD guard at the bottom lets tests or other
// build-time code require() this file without a browser.

// Promote search-placeholder <span data-href> to real links. Search links are
// baked as spans so they don't appear (or navigate) when JS is disabled; this
// runs once JS is available.
function upgradeSearchLinks(container) {
  const root = container || document;
  root.querySelectorAll("span[data-href]").forEach((el) => {
    const a = document.createElement("a");
    a.href = el.getAttribute("data-href");
    if (el.hasAttribute("title")) {
      a.setAttribute("title", el.getAttribute("title"));
    }
    a.className = el.className;
    a.innerHTML = el.innerHTML;
    el.replaceWith(a);
  });
}

// True when the keydown target is a text-editing control, in which case global
// hotkeys (/, 1-9, Enter, J/K) should not fire.
function isEditableTarget(target) {
  return (
    target &&
    (target.tagName === "INPUT" ||
      target.tagName === "TEXTAREA" ||
      target.tagName === "SELECT" ||
      target.isContentEditable)
  );
}

// A search should not trigger on an editable target, with modifier keys pressed.
function isEditableOrModified(e) {
  return (
    e.ctrlKey ||
    e.metaKey ||
    e.altKey ||
    isEditableTarget(e.target)

}

// Push a ?q= query (or strip it) onto the URL without reloading, so the filter
// is shareable and survives back/forward navigation.
function updateUrl(query) {
  const url = new URL(window.location);
  if (query.trim()) {
    url.search = "q=" + encodeURIComponent(query.trim());
  } else {
    url.search = "";
  }
  history.pushState({}, "", url);
}

// Read the current ?q= query from the URL, or "" when absent.
function queryFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("q") || "";
}

// Wire up the standard search scaffolding shared by every search page:
// restoring an initial query, a debounced input handler, and popstate. Returns
// a perform(query) caller that applies the URL/restore semantics.
function bindSearchInput(input, perform) {
  const initialQuery = queryFromUrl();
  if (initialQuery) {
    input.value = initialQuery;
    perform(initialQuery);
  }

  let debounceTimer = null;
  input.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      const query = input.value;
      updateUrl(query);
      perform(query);
    }, 500);
  });

  window.addEventListener("popstate", () => {
    const query = queryFromUrl();
    input.value = query;
    perform(query);
  });

  module.exports = {
    upgradeSearchLinks,
    isEditableTarget,
    isEditableOrModified,
    updateUrl,
    queryFromUrl,
    bindSearchInput,

// ---------------------------------------------------------------------------
// Depends on search-utils.js (loaded first): updateUrl, isEditableTarget,
// bindSearchInput. See templates/photos.js for the load order.
// Also depends on month-utils.js for MONTH_NAMES_LOWER, MONTH_SHORT, MONTH_ALT.

// ---------------------------------------------------------------------------
// tryParseDateQuery — interprets a user-typed date query into year/month/day
// components (with hasYear/hasMonth/hasDay flags) so it can be matched against
// build-time photo date ints. This is the one part of search that must run in
// the browser, since it reads live input. All date parsing/formatting of the
// photos themselves happens at build time (see templates/utils.js).
// ---------------------------------------------------------------------------

function tryParseDateQuery(query) {
  const q = query.trim();
  if (!q) return null;

  const hasYear = /\b\d{4}\b/.test(q);
  const hasMonthName = new RegExp(MONTH_ALT, "i").test(q);
  const hasSlash = /[\/\-\.]/.test(q);

  if (/^\d{4}$/.test(q)) {
    return { year: Number(q), hasYear: true, hasMonth: false, hasDay: false, raw: q };
  }

  const lower = q.toLowerCase().trim();
  for (let i = 0; i < 12; i++) {
    if (lower === MONTH_NAMES_LOWER[i] || lower === MONTH_SHORT[i]) {
      return { month: i + 1, hasYear: false, hasMonth: true, hasDay: false, raw: q };
    }
  }

  // Month name + year (e.g. "August 2026", "Aug 2026")
  const monthYear = q.match(new RegExp(`^(${MONTH_ALT})[a-z]*\\s+(\\d{4})$`, "i"));
  if (monthYear) {
    const name = monthYear[1].toLowerCase();
    const idx = MONTH_SHORT.findIndex((m) => name.startsWith(m));
    if (idx !== -1) {
      return { year: Number(monthYear[2]), month: idx + 1, hasYear: true, hasMonth: true, hasDay: false, raw: q };
    }
  }

  // Month name + day + year (e.g. "August 21, 2026", "21 August 2026")
  const builtIn = new Date(q);
  if (!isNaN(builtIn) && (/\d/.test(q) || hasMonthName)) {
    const y = builtIn.getUTCFullYear();
    const m = builtIn.getUTCMonth() + 1;
    const d = builtIn.getUTCDate();
    if (!isNaN(y) && !isNaN(m) && !isNaN(d)) {
      let hasDay = false;
      if (hasMonthName) {
        const dayCandidates = (q.match(/\b\d{1,2}\b/g) || []).filter((n) => n.length <= 2 && Number(n) >= 1 && Number(n) <= 31);
        hasDay = dayCandidates.length > 0;
        if (q.match(new RegExp(`^(${MONTH_ALT})[a-z]*\\s+\\d{4}$`, "i"))) hasDay = false;
      } else if (hasSlash) {
        hasDay = (q.match(/\d+/g) || []).length >= 3;
      }
      return { year: y, month: m, day: d, hasYear: hasYear, hasMonth: hasMonthName || hasSlash, hasDay: hasDay, raw: q };
    }
  }

  // EU fallback: dd/mm/yyyy
  const eu = q.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if (eu) {
    const a = Number(eu[1]);
    const b = Number(eu[2]);
    const y = Number(eu[3]);
    if (a >= 1 && a <= 31 && b >= 1 && b <= 12) {
      const dt = new Date(Date.UTC(y, b - 1, a));
      if (dt.getUTCDate() === a && dt.getUTCMonth() === b - 1 && dt.getUTCFullYear() === y) {
        return { year: y, month: b, day: a, hasYear: true, hasMonth: true, hasDay: true, raw: q };
      }
    }
  }

  // ISO with slashes: yyyy/mm/dd
  const iso = q.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);
  if (iso) {
    const y = Number(iso[1]);
    const m = Number(iso[2]);
    const d = Number(iso[3]);
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCDate() === d && dt.getUTCMonth() === m - 1) {
      return { year: y, month: m, day: d, hasYear: true, hasMonth: true, hasDay: true, raw: q };
    }
  }

  // Numeric month/year: mm/yyyy or yyyy/mm
  const my = q.match(/^(\d{1,2})[\/\-\.](\d{4})$/);
  if (my) {
    const m = Number(my[1]);
    const y = Number(my[2]);
    if (m >= 1 && m <= 12) {
      return { year: y, month: m, hasYear: true, hasMonth: true, hasDay: false, raw: q };
    }
  }
  const ym = q.match(/^(\d{4})[\/\-\.](\d{1,2})$/);
  if (ym) {
    const y = Number(ym[1]);
    const m = Number(ym[2]);
    if (m >= 1 && m <= 12) {
      return { year: y, month: m, hasYear: true, hasMonth: true, hasDay: false, raw: q };
    }
  }
  return null;
}

// ---------------------------------------------------------------------------
// filterByQuery — returns the photos (in input order) matching a search query.
// Operates on build-time items: { slug, search, y, m, d } where `search` is a
// precomputed lowercase haystack and y/m/d are UTC date ints. Shared by the
// grid page (DOM data-attributes) and the single-photo page (photo-data.json).
// ---------------------------------------------------------------------------
function filterByQuery(items, query) {
  const q = query.toLowerCase().trim();
  if (!q) return null;
  const dateQuery = tryParseDateQuery(query);
  const matches = [];
  for (const item of items) {
    if (item.search && item.search.includes(q)) {
      matches.push(item);
      continue;
    }
    if (dateQuery) {
      if (dateQuery.hasYear && dateQuery.year !== item.y) continue;
      if (dateQuery.hasMonth && dateQuery.month !== item.m) continue;
      if (dateQuery.hasDay && dateQuery.day !== item.d) continue;
      if (dateQuery.hasYear || dateQuery.hasMonth || dateQuery.hasDay) {
        matches.push(item);
      }
    }
  }
  return matches.length ? matches : null;
}

// ---------------------------------------------------------------------------
// Search — progressive enhancement. Activates only when:
//   1. Running in a browser (document exists)
//   2. #photo-search input is in the DOM

// fetch is needed. Without the input present, the static grid is untouched.

  const searchInput = document.getElementById("photo-search");
  if (!searchInput) return;

  const grid = document.getElementById("photo-grid");
  const noResults = document.getElementById("photo-no-results");
  if (!grid) return;

  // Build a flat index from the precomputed data-* attributes.
  const searchIndex = [];
  for (const el of grid.querySelectorAll(".photo-item")) {
    searchIndex.push({
      slug: el.getAttribute("data-slug"),
      search: el.getAttribute("data-search") || "",
      y: Number(el.getAttribute("data-y")) || 0,
      m: Number(el.getAttribute("data-m")) || 0,
      d: Number(el.getAttribute("data-d")) || 0,
    });
  }

    const matches = filterByQuery(searchIndex, query);
    if (!matches) return null;
    const matchSet = new Set(matches.map((m) => m.slug));

    for (const el of grid.querySelectorAll(".photo-item")) {
      const slug = el.getAttribute("data-slug");
      const link = el.querySelector("a");
      if (!link) continue;
      if (query) {
        link.setAttribute("href", `/photos/${slug}/?q=${encodeURIComponent(query)}`);
      } else {
        link.setAttribute("href", `/photos/${slug}/`);
      }

    let n = 0;
    for (const el of grid.querySelectorAll(".photo-item")) {
      if (el.hidden) continue;
      n++;
      const link = el.querySelector("a");
      if (!link) continue;
      if (n <= 9) {
        link.setAttribute("title", `Open photo (${n})`);
      } else {
        link.removeAttribute("title");
      }
    }

    const q = query.trim();
    if (!q) {
      for (const el of grid.querySelectorAll(".photo-item")) {
        el.hidden = false;
      }
      if (noResults) noResults.hidden = true;
      grid.removeAttribute("data-search-active");
      setPhotoLinks("");
    } else {
      const result = runSearch(q);
      if (!result) {
        for (const el of grid.querySelectorAll(".photo-item")) {
          el.hidden = true;
        }
        if (noResults) noResults.hidden = false;
        grid.setAttribute("data-search-active", "");

          const slug = el.getAttribute("data-slug");
          el.hidden = !result.has(slug);
        }

    // Allow Enter when the search input itself is focused (it has no default
    // submit), but ignore other text-editing fields.
    if (e.target && e.target !== searchInput && isEditableTarget(e.target)) {
      return;
    }
    // Apply the filter now so Enter works even before the 500ms debounce fires.
    performSearch(searchInput.value);
    const first = numberedItem(1);
    const link = first && first.querySelector("a[href]");
    if (link) {
      e.preventDefault();
      window.location.href = link.getAttribute("href");
    }
  });

  searchInput.removeAttribute("disabled");
  searchInput.setAttribute("placeholder", "🔍 Search…");
  searchInput.setAttribute(
    "title",
    "Search —\n/ focus · Esc clear · Enter open first",
  );

  // "/" focuses the search bar (matching common gallery/reader conventions).
  document.addEventListener("keydown", (e) => {
    if (
      e.ctrlKey ||
      e.metaKey ||
      e.altKey ||
      e.key !== "/" ||
      document.activeElement === searchInput ||
      isEditableTarget(e.target)
    ) {
      return;
    }
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  });

  // "1"–"9" navigates to the nth visible photo in the current (filtered) grid.
  function numberedItem(n) {
    const visible = [];
    for (const el of grid.querySelectorAll(".photo-item")) {
      if (!el.hidden) {
        visible.push(el);
      }
    }
    return visible[n - 1] || null;
  }

  function digitKeyNav(e) {
    if (e.ctrlKey || e.metaKey || e.altKey || document.activeElement === searchInput) {
      return;
    }
    if (isEditableTarget(e.target)) {
      return;
    }
    const digit = parseInt(e.key, 10);
    if (!Number.isInteger(digit) || digit < 1 || digit > 9) {
      return;
    }
    const item = numberedItem(digit);
    const link = item && item.querySelector("a[href]");
    if (link) {
      e.preventDefault();
      window.location.href = link.getAttribute("href");
    }
  }

  document.addEventListener("keydown", digitKeyNav);

  // Esc clears the search (and its URL) even when the input isn't focused.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || e.ctrlKey || e.metaKey || e.altKey) {
      return;
    }
    if (!searchInput.value.trim()) {
      return;
    }
    e.preventDefault();
    searchInput.value = "";
    updateUrl("");
    performSearch("");
    searchInput.blur();
  });
}());

// ---------------------------------------------------------------------------
// UMD guard — allows the single-photo page (photo-single.js, loaded after this
// file) to call filterByQuery / tryParseDateQuery. Not required at build time.
// ---------------------------------------------------------------------------
if (typeof module !== "undefined") {
  module.exports = { filterByQuery, tryParseDateQuery };
}

(function () {
  // upgradeSearchLinks / isEditableTarget come from search-utils.js (loaded
  // first; see templates/photo-single.js for the load order).

  upgradeSearchLinks(document);

  // Keyboard hints — applied only here (never baked at build time) since the
  // P/D/C/Esc shortcuts only work once JS runs.
  const plantLink = document.querySelector(
    '.specs a.search-link[href^="/plants/"]',
  );
  if (plantLink) plantLink.setAttribute("title", "View plant (P)");
  const dateLink = document.querySelector(
    '.specs a.search-link[href^="/photos/"] time',
  );
  if (dateLink) dateLink.closest("a").setAttribute("title", "View date (D)");
  const cameraLink = Array.from(
    document.querySelectorAll('.specs a.search-link[href^="/photos/"]'),
  ).find((a) => !a.querySelector("time"));
  if (cameraLink) cameraLink.setAttribute("title", "View camera (C)");
  const photosLink = document.querySelector('header a[href^="/photos"]');
  if (photosLink) photosLink.setAttribute("title", "View photos (Esc)");
  const originalLink = document.querySelector(".download a");
  if (originalLink)
    originalLink.setAttribute("title", "Download original (O)");

  // Swipe state — horizontal swipe anywhere on the page navigates prev/next,
  // mirroring the J/K keybinds via the shared navHref resolver.
  let touchStartX = null;
  let touchStartY = null;
  let touchCount = 0;

  const query = queryFromUrl();
  const currentSlug = window.location.pathname
    .split("/")
    .filter(Boolean)
    .pop() || "";

  // Honor an active query in the header "PHOTOS" link so returning to the grid
  // keeps the same filtered set the user came from.
  function scopeHeaderPhotosLink() {
    if (!query.trim()) return;
    const link = document.querySelector('header a[href="/photos"]');
    if (link) {
      link.href = `/photos/?q=${encodeURIComponent(query.trim())}`;
    }
  }
  scopeHeaderPhotosLink();

  // Query-scoped prev/next slugs, computed from /photos/photo-data.json once a
  // query is present. J/K and the visible nav both use this so keyboard
  // navigation stays within the filtered set (not the chronological fallback).
  let scopedNav = null; // { prev: slug|null, next: slug|null }
  // True once a query-scoped set has been applied (even a single match, where
  // scopedNav is null). When true, J/K never falls back to chronological nav.
  let scopedActive = false;
  // False while a query's filtered set is still being resolved, so the static
  // chronological nav is neither shown nor used by J/K during that window.
  let navReady = !query.trim();

  function scopedHref(type) {
    if (!scopedNav) return null;
    const slug = type === "prev" ? scopedNav.prev : scopedNav.next;
    return slug
      ? `/photos/${slug}/?q=${encodeURIComponent(query.trim())}`
      : null;
  }

  // Resolve a nav href for J/K: query-scoped links when a filter is active,
  // otherwise the static chronological anchors once ready (no query, current
  // photo not in the set, or the fetch failed). During a query's pending
  // resolution the nav is hidden and J/K no-ops.
  function navHref(type) {
    if (scopedActive) {
      return scopedHref(type);
    }
    if (!navReady) return null;
    const sel = type === "prev" ? ".photo-nav-prev[href]" : ".photo-nav-next[href]";
    const el = document.querySelector(sel);
    return el ? el.getAttribute("href") : null;
  }

  // When the page is reached via a grid/photos search query (?q=...), scope the
  // prev/next nav to the matching photo set instead of the full chronological
  // order. Without a query, or without JS/data, the static chronological nav
  // stays untouched.
  function scopedNavFromQuery(queryStr, current, photos) {
    if (!queryStr.trim()) return null;
    const matches = window.filterByQuery
      ? window.filterByQuery(photos, queryStr)
      : null;
    if (!matches || !matches.length) return null;

    const idx = matches.findIndex((m) => m.slug === current);
    if (idx === -1) return null; // current photo not in set — leave chrono nav

    return {
      prev: idx > 0 ? matches[idx - 1] : null,
      next: idx < matches.length - 1 ? matches[idx + 1] : null,
      count: matches.length,
    };
  }

  function renderNavLink(type, slug, queryStr) {
    const isPrev = type === "prev";
    const label = isPrev
      ? `<span class="up-arrow">&larr;</span>PREV`
      : `NEXT<span class="up-arrow up-arrow--right">&rarr;</span>`;
    const cls = isPrev ? "photo-nav-prev" : "photo-nav-next";
    if (slug) {
      const href = `/photos/${slug}/?q=${encodeURIComponent(queryStr.trim())}`;
      const rel = isPrev ? "prev" : "next";
      return `<a href="${href}" class="${cls}" rel="${rel}">${label}</a>`;
    }
    return `<span class="${cls} disabled" aria-hidden="true">${label}</span>`;
  }

  // Prev/next titles are applied here (never baked at build time) since J/K
  // only work once JS runs.
  function applyNavTitles() {
    const prev = document.querySelector(".photo-nav-prev[href]");
    const next = document.querySelector(".photo-nav-next[href]");
    if (prev) prev.setAttribute("title", "Previous (K)");
    if (next) next.setAttribute("title", "Next (J)");
  }
  applyNavTitles();

  function applyScopedNav(scoped, queryStr) {
    const nav = document.querySelector(".photo-nav");
    if (!nav) return;

    scopedActive = true;

    if (scoped.count <= 1) {
      // Only one photo matches — hide the whole nav.
      nav.style.display = "none";
      scopedNav = null;
      return;
    }

    scopedNav = {
      prev: scoped.prev ? scoped.prev.slug : null,
      next: scoped.next ? scoped.next.slug : null,
    };

    const prevEl = nav.querySelector(".photo-nav-prev");
    const nextEl = nav.querySelector(".photo-nav-next");

    const nextPrevHtml = renderNavLink("prev", scopedNav.prev, queryStr);
    const nextNextHtml = renderNavLink("next", scopedNav.next, queryStr);

    if (prevEl) {
      const tmp = document.createElement("div");
      tmp.innerHTML = nextPrevHtml;
      prevEl.replaceWith(tmp.firstElementChild);
    }
    if (nextEl) {
      const tmp = document.createElement("div");
      tmp.innerHTML = nextNextHtml;
      nextEl.replaceWith(tmp.firstElementChild);
    }
    applyNavTitles();
  }

  function navigateBySwipe(deltaX, deltaY) {
    if (isEditableTarget(document.activeElement)) return;
    if (Math.abs(deltaY) >= Math.abs(deltaX)) return; // vertical — page scroll
    if (Math.abs(deltaX) < 40) return; // accidental tap/drag
    const href = deltaX < 0 ? navHref("next") : navHref("prev");
    if (href) {
      window.location.href = href;
    }
  }

  document.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    if (!t) return;
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchCount = e.touches.length;
  });

  document.addEventListener("touchend", (e) => {
    const t = e.changedTouches[0];
    if (!t) return;
    if (touchCount === 1 && touchStartX !== null && touchStartY !== null) {
      navigateBySwipe(t.clientX - touchStartX, t.clientY - touchStartY);
    }
    touchStartX = null;
    touchStartY = null;
    touchCount = 0;
  });

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) {
      return;
    }

    if (isEditableTarget(e.target)) {
      return;
    }

    const key = (e.key || String.fromCharCode(e.keyCode || 0)).toLowerCase();

    if (key === "j") {
      const href = navHref("next");
      if (href) {
        window.location.href = href;
      }
    } else if (key === "k") {
      const href = navHref("prev");
      if (href) {
        window.location.href = href;
      }
    } else if (key === "p") {
      const plantLink = document.querySelector(
        '.specs a.search-link[href^="/plants/"]',
      );
      if (plantLink) {
        window.location.href = plantLink.href;
      }
    } else if (key === "d") {
      const dateLink = document.querySelector(
        '.specs a.search-link[href^="/photos/"] time',
      )?.closest("a");
      if (dateLink) {
        window.location.href = dateLink.href;
      }
    } else if (key === "c") {
      const cameraLink = Array.from(
        document.querySelectorAll('.specs a.search-link[href^="/photos/"]'),
      ).find((a) => !a.querySelector("time"));
      if (cameraLink) {
        window.location.href = cameraLink.href;
      }
    } else if (key === "o") {
      const originalLink = document.querySelector(".download a");
      if (originalLink) {
        window.location.href = originalLink.href;
      }
    } else if (key === "escape") {
      // Esc returns to the grid, honoring an active filter when present.
      window.location.href = query.trim()
        ? `/photos/?q=${encodeURIComponent(query.trim())}`
        : "/photos/";
    }
  });

  if (!query.trim()) return;

  // Hide the static chronological nav while the filtered set is computed so it
  // doesn't flash before being replaced by the query-scoped nav.
  const nav = document.querySelector(".photo-nav");
  if (nav) nav.style.visibility = "hidden";

  const finish = () => {
    navReady = true;
    if (nav) nav.style.visibility = "";
  };

  fetch("/photos/photo-data.json")
    .then((res) => {
      if (!res.ok) throw new Error("fetch failed");
      return res.json();
    })
    .then((data) => {
      const photos = Array.isArray(data.photos) ? data.photos : data;
      const scoped = scopedNavFromQuery(query, currentSlug, photos);
      finish();
      if (scoped) {
        applyScopedNav(scoped, query);
      }
      // else: reveal the chronological nav; scopedNav stays null so J/K uses it.
    })
    .catch(() => {
      // Data unavailable — reveal the static chronological nav.
      finish();
    });
}());
</script>
	
  </body>
