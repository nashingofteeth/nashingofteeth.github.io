    <script>// Shared keybind helper — loaded first on every templated page (see
// templates/*.js for the load order). Single place for the guards every
// keydown handler needs: modifier keys, text-editing targets, and key
// normalization. Page scripts (photos.js, photo-single.js, plants.js,
// videos.js, home.js) and the global defaults (keybinds.js, loaded last)
// register via onKey() instead of raw addEventListener("keydown").
// Collection pages (photos, plants, tools) offer mouseless list nav via
// bindDigitNav().
//
// Ordering contract: page-specific handlers are registered before the
// global defaults (page assets come before keybinds.js in loadJs), so a
// page handler that preventDefaults an Escape press (e.g. clearing a
// non-empty search) runs first and the global up-nav skips via
// e.defaultPrevented. Works at build time (require) and in the browser
// (globals + UMD guard, mirroring month-utils.js).

// Keybinds are skipped on touch-first devices (phones/tablets): no physical
// keyboard means every keybind + its scroll-driven hint bookkeeping is dead
// weight. matchMedia pointer test (not ontouchstart) so touchscreen laptops
// with a mouse primary keep binds. Evaluated once at load — docking a
// keyboard mid-session needs a reload. Node/ancient browsers default to
// enabled (safe, current behavior).
const KEYBINDS_ENABLED =
  typeof window === "undefined" ||
  typeof window.matchMedia === "undefined" ||
  !window.matchMedia("(pointer: coarse)").matches;

function isEditableTarget(target) {
  return (
    target &&
    (target.tagName === "INPUT" ||
      target.tagName === "TEXTAREA" ||
      target.tagName === "SELECT" ||
      target.isContentEditable)
  );
}

function hasModifier(e) {
  return e.ctrlKey || e.metaKey || e.altKey;
}

// Normalize a key event to a lowercase match token: "Escape" → "escape",
// " " / "Spacebar" → "space", "Esc" → "escape". Falls back to keyCode for
// very old browsers (mirrors the photo-single.js fallback).
function normalizeKey(e) {
  const raw = (e.key || String.fromCharCode(e.keyCode || 0) || "").toLowerCase();
  if (raw === " " || raw === "spacebar") {
    return "space";
  }
  if (raw === "esc") {
    return "escape";
  }
  return raw;
}

// Register a keydown handler with shared guards. keys is a single key or
// an array of keys (post-normalization, e.g. "escape", "j", "/").
// By default handlers are skipped inside text-editing targets and when a
// modifier is held; pass { allowInEditable: true } for handlers like
// Enter-to-open-first that explicitly manage the focused-input case.
// No-ops without a document (build time). The handler owns
// preventDefault + navigation.
function onKey(keys, handler, opts = {}) {
  if (typeof document === "undefined" || !KEYBINDS_ENABLED) {
    return;
  }
  const wanted = Array.isArray(keys) ? keys : [keys];
  const allowInEditable = Boolean(opts.allowInEditable);
  document.addEventListener("keydown", (e) => {
    if (hasModifier(e)) {
      return;
    }
    if (!allowInEditable && isEditableTarget(e.target)) {
      return;
    }
    if (!wanted.includes(normalizeKey(e))) {
      return;
    }
    handler(e, normalizeKey(e));
  });
}

// Partial-visibility test: any part of the element inside the viewport.
// Zero-rect elements (display:none, e.g. collapsed plants subtrees) fail
// the bottom check and self-exclude. Used for SPACE play/pause targeting,
// where a mostly-visible player still counts.
function isInViewport(el) {
  if (typeof window === "undefined" || !el.getBoundingClientRect) {
    return false;
  }
  const rect = el.getBoundingClientRect();
  return (
    rect.bottom > 0 &&
    rect.top < window.innerHeight &&
    rect.right > 0 &&
    rect.left < window.innerWidth
  );
}

// Top-visibility test for nth-keybind candidates: the link's top edge must
// be on screen (never scrolled past), while running below the fold is fine.
// Horizontal containment still required. Zero-rect elements (display:none,
// e.g. collapsed plants subtrees) fail the bottom check and self-exclude.
function isFullyInViewport(el) {
  if (typeof window === "undefined" || !el.getBoundingClientRect) {
    return false;
  }
  const rect = el.getBoundingClientRect();
  return (
    rect.top >= 0 &&
    rect.left >= 0 &&
    rect.right <= window.innerWidth &&
    rect.bottom > 0
  );

// Tell the ? overlay (keybinds.js, loaded last) to repaint its badges
// from the fresh titles. Event-based so script load order doesn't matter;
// a closed overlay ignores it and builds fresh on open anyway. Shared by
// bindDigitNav below and by page scripts that retitle hints outside it
// (videos.js re-hints after the play link swaps into a player).
function notifyHintsChanged() {
  if (typeof document === "undefined" || typeof CustomEvent === "undefined") {
    return;
  }
  try {
    document.dispatchEvent(new CustomEvent("keybind-hints:changed"));
  } catch (_err) {
    // ignore — overlay repaint is best-effort
  }
}

// Mouseless list nav: "1"–"9" opens the nth top-visible link from
// getLinks(), a page-provided resolver returning candidate <a> elements in
// priority (DOM) order. Links scrolled past the top never bind; running
// below the fold is fine. Only ever targets the
// types (download buttons, toggles, photo links) are never hijacked.
// Hint titles "(n)" are managed here: originals are saved per link and
// restored when the link leaves the set. Base title is the link's own title,
// else its text (40 chars), else opts.label. Refreshes on scroll (passive,
// rAF-throttled) + resize + load; returns refresh() for manual calls after
// page re-renders (search). opts.ignoreWhen() (optional) vetoes a digit
// press before navigation — lets a page reserve plain digits while its own
// chord (plants p+digit) owns them. No-ops without a document (build time).
function bindDigitNav(getLinks, opts = {}) {
  // Touch devices skip everything below: no binds, no scroll/resize
  // listeners, no hint title writes.
  if (typeof document === "undefined" || !KEYBINDS_ENABLED) {
    return () => {};
  }
  const label = opts.label || "Open link";
  const savedTitles = new WeakMap();
  let hinted = [];

  function baseTitle(link) {
    const current = link.getAttribute("title") || "";
    if (current && !/\(\d\)$/.test(current)) {
      return current;
    }
    const text = ((link.textContent || "").trim().slice(0, 40));
    return text || label;
  }

  function currentLinks() {
    // Collect only the first 9 top-visible links: getBoundingClientRect()
    // forces layout, so filter()+slice() would rect every link on the page
    // (300+ photos) per scroll frame only to discard all but 9.
    const top = [];
    for (const link of getLinks()) {
      if (top.length >= 9) {
        break;
      }
      if (isFullyInViewport(link)) {
        top.push(link);
      }
    }
    return top;
  }

  function refresh() {
    const next = currentLinks();
    // Small scrolls leave the top-9 set unchanged — skip the title restore
    // + rewrite (pointless DOM writes) in that case. The changed event still
    // fires below: sibling hints outside this set (plants "(p)") may have
    // moved, and the overlay coalesces repeat repaints into one per frame.
    const same = hinted.length === next.length &&
      hinted.every((link, i) => link === next[i]);
    if (!same) {
      for (const link of hinted) {
        if (savedTitles.has(link)) {
          const original = savedTitles.get(link);
          if (original) {
            link.setAttribute("title", original);
          } else {
            link.removeAttribute("title");
          }
        }
      }
      hinted = next;
      hinted.forEach((link, i) => {
        if (!savedTitles.has(link)) {
          savedTitles.set(link, link.getAttribute("title"));
        }
        link.setAttribute("title", `${baseTitle(link)} (${i + 1})`);
      });
    }
    // Search re-renders (photos performSearch, plants renderTree) land here
    // via the returned refresh() — repaint an open ? overlay so its badges
    // never show stale numbers or hidden items.
    notifyHintsChanged();
  }

  onKey(["1", "2", "3", "4", "5", "6", "7", "8", "9"], (e, key) => {
    // Shift+digit belongs to page-specific binds (plants toggles shift the
    // nth subtree); plain digits only here so the two never double-fire.
    if (e.shiftKey) {
      return;
    }
    if (typeof opts.ignoreWhen === "function" && opts.ignoreWhen()) {
      return;
    }
    const links = currentLinks();
    const link = links[Number(key) - 1];
    if (link) {
      e.preventDefault();
      window.location.href = link.href;
    }
  });

  let rafPending = false;
  function scheduleRefresh() {
    if (rafPending) {
      return;
    }
    rafPending = true;
    const raf = window.requestAnimationFrame || ((fn) => setTimeout(fn, 0));
    raf(() => {
      rafPending = false;
      refresh();
    });
  }
  document.addEventListener("scroll", scheduleRefresh, { passive: true });
  window.addEventListener("resize", scheduleRefresh);
  refresh();
  return refresh;
}

// ---------------------------------------------------------------------------
// Grid scroll memory for Esc returns. Esc-driven grid arrivals (single photo
// page → /photos/, single video page → /videos/) are full navigations that
// always land at top, so the return leg is bridged with per-tab one-shot
// state: grid pages persist scrollY at departure (pagehide), Esc handlers
// flag the return, and the grid load below consumes the flag once.
// Browser back/forward/reload are untouched (scrollRestoration stays auto) —
// restoration only ever fires on the Esc flag. Storage may throw (private
// mode), in which case everything degrades to current top-landing behavior.
// ---------------------------------------------------------------------------
function sessGet(key) {
  try {
    return window.sessionStorage.getItem(key);
  } catch (_err) {
    return null;
  }
}

function sessSet(key, value) {
  try {
    window.sessionStorage.setItem(key, value);
  } catch (_err) {
    // ignore — scroll memory is best-effort
  }
}

function sessDel(key) {
  try {
    window.sessionStorage.removeItem(key);
  } catch (_err) {
    // ignore — scroll memory is best-effort
  }
}

function gridPath() {
  return window.location.pathname || "/";
}

// Mark the next load of gridPath as an Esc return. Call immediately before
// navigating there so the flag can't go stale.
function flagEscReturn(gridPath) {
  sessSet(`esc-return:${gridPath}`, "1");
}

// Clicking the header up-link from a single item page should restore the
// grid's scroll position exactly like Esc does — flag the return on click,
// then let the browser navigate. Not a keybind, so it also runs on touch
// devices (the saver side, trackGridScroll, is active there too). gridPath
// is the grid's pathname ("/photos/" style); header hrefs are baked without
// the trailing slash ("/photos"), so the selector prefix strips it while the
// flag key keeps it (matching trackGridScroll's pathname keys). A stale flag
// is possible only if navigation never follows the click, and it is consumed
// harmlessly by the next grid load.
function bindUpNavRestore(gridPath) {
  if (typeof document === "undefined") {
    return;
  }
  const key = gridPath.endsWith("/") ? gridPath : `${gridPath}/`;
  const link = document.querySelector(
    `header a[href^="${gridPath.replace(/\/$/, "")}"]`,
  );
  if (!link) {
    return;
  }
  link.addEventListener("click", () => {
    flagEscReturn(key);
  });
}

// Track scroll for the current grid page: persist at departure, and consume
// a pending Esc return (restore now via rAF, then re-apply on window load
// only if the user hasn't scrolled meanwhile — late image layout shifts must
// not yank a user who already moved). Call once per grid load; grids only.
function trackGridScroll() {
  if (typeof document === "undefined" || typeof window === "undefined") {
    return;
  }
  const path = gridPath();
  window.addEventListener("pagehide", () => {
    sessSet(`grid-scroll:${path}`, String(window.scrollY || 0));
  });
  if (!sessGet(`esc-return:${path}`)) {
    return;
  }
  sessDel(`esc-return:${path}`);
  const y = Number(sessGet(`grid-scroll:${path}`)) || 0;
  const raf = window.requestAnimationFrame || ((fn) => setTimeout(fn, 0));
  raf(() => {
    window.scrollTo(0, y);
    const settled = window.scrollY;
    window.addEventListener("load", () => {
      if (window.scrollY === settled) {
        window.scrollTo(0, y);
      }
    });
  });
}

if (typeof module !== "undefined") {
  module.exports = {
    isEditableTarget,
    hasModifier,
    normalizeKey,
    onKey,
    KEYBINDS_ENABLED,
    isInViewport,
    isFullyInViewport,
    bindDigitNav,
    flagEscReturn,
    trackGridScroll,
    bindUpNavRestore,
    notifyHintsChanged,
    sessGet,
    sessSet,
    sessDel,
  };

// Expose as globals for concatenated browser scripts (loadJs joins files
// into one classic script, so top-level declarations are already shared;
// globalThis assignment mirrors month-utils.js for explicitness).

  globalThis.isEditableTarget = isEditableTarget;
  globalThis.hasModifier = hasModifier;
  globalThis.normalizeKey = normalizeKey;
  globalThis.onKey = onKey;
  globalThis.KEYBINDS_ENABLED = KEYBINDS_ENABLED;
  globalThis.isInViewport = isInViewport;
  globalThis.isFullyInViewport = isFullyInViewport;
  globalThis.bindDigitNav = bindDigitNav;
  globalThis.flagEscReturn = flagEscReturn;
  globalThis.trackGridScroll = trackGridScroll;
  globalThis.bindUpNavRestore = bindUpNavRestore;
  globalThis.notifyHintsChanged = notifyHintsChanged;
  globalThis.sessGet = sessGet;
  globalThis.sessSet = sessSet;
  globalThis.sessDel = sessDel;
}

// ---------------------------------------------------------------------------
// tools.js — tools-list mouseless nav. Loaded only on /tools/ (see
// templates/tools.js for the load order). Guards + bindDigitNav() come from
// keybind-utils.js (loaded first). Scoped to main article links so header

// ---------------------------------------------------------------------------

  if (typeof document === "undefined") {
    return;
  }

  bindDigitNav(() =>
    Array.from(document.querySelectorAll("main article a[href]")),

// every templated page (see templates/*.js for the load order) so
// page-specific handlers registered via onKey() run first. Guards
// (modifiers, editable targets, key normalization) come from
// keybind-utils.js (loaded first); this file owns only global behavior:

//   Escape → up (section parent, else home)
//   j / k  → half-viewport scroll (except photo-single pages, which own j/k

//            owns j/k for prev/next video snap in videos.js)

//     grid return + scoped prev/next), so this file stays inert there.
//   - videos.js owns j/k on /videos/ (prev/next video snap), so this file
//     stays inert there (single-video pages keep the half-viewport scroll).
//   - photos.js / plants.js own Escape when their search input has content
//     (clear semantics: they clear + preventDefault, registered before this

  if (typeof document === "undefined") {
    return;
  }

  function pathName() {
    return window.location.pathname || "/";
  }

  function isPhotoSinglePage() {
    return /^\/photos\/[^/]+\/?$/.test(pathName());
  }

  function isVideosGrid() {
    const p = pathName();
    return p === "/videos/" || p === "/videos/index.html";
  }

  // The grid search input the user is currently typing in, if any.
  function activeSearchInput() {
    const active = document.activeElement;
    if (
      active &&
      (active.id === "photo-search" || active.id === "plant-search")
    ) {
      return active;
    }
    return null;
  }

  // Resolve the Escape "up" target. Null means no-op (home, or a page whose
  // own script owns Escape).
  function upHref() {
    const p = pathName();
    if (p === "/" || p === "/index.html") {
      return null;
    }
    if (isPhotoSinglePage()) {
      return null;
    }
    if (/^\/videos\/[^/]+\/?$/.test(p)) {
      return "/videos/";
    }
    if (/^\/(videos|photos|plants|tools)\/?$/.test(p)) {
      return "/";
    }
    return "/";

  // runtime-applied "(K)"/"(Esc)" titles in photo-single.js. Skipped on
  // touch devices — never advertise dead keys.
  function applyEscHint() {
    if (!KEYBINDS_ENABLED) {
      return;
    }
    const href = upHref();
    if (!href) {
      return;
    }
    const link = document.querySelector(`header a[href="${href}"]`);
    if (link && !/\(Esc\)/.test(link.getAttribute("title") || "")) {
      const base = (link.getAttribute("title") || "").trim();
      link.setAttribute("title", base ? `${base} (Esc)` : "Up (Esc)");
    }
  }
  applyEscHint();

  // navigates up; a focused search with content belongs to the page
  // clear-handler (registered first), which preventDefaults the press.
  onKey(
    "escape",
    (e) => {
      // A grid clear-handler (photos.js / plants.js, registered first) clears
      // a non-empty search and preventDefaults the same press — never navigate
      // after that, or Esc-with-query would both clear and leave the page.
      if (e.defaultPrevented) {
        return;
      }
      const activeSearch = activeSearchInput();
      // Fallback when this file ever runs before the clear-handler: a focused
      // search that still has content belongs to the clearer, not to up-nav.
      if (activeSearch && activeSearch.value.trim()) {
        return;
      }
      if (!activeSearch && isEditableTarget(e.target)) {
        return;
      }
      const href = upHref();
      if (href) {
        e.preventDefault();
        // Flag grid returns so the grid restores scroll position on arrival.
        // Only /videos/ is a grid target here (photo singles own their Esc).
        if (href === "/videos/") {
          flagEscReturn(href);
        }
        window.location.href = href;
      }
    },
    { allowInEditable: true },
  );

  // Half-viewport scroll. Photo-single pages own j/k for prev/next, and the
  // videos grid owns j/k for prev/next video snap (videos.js) — both stay
  // inert here. Single-video pages keep the half-viewport scroll.
  onKey(["j", "k"], (e, key) => {
    if (isPhotoSinglePage() || isVideosGrid()) {
      return;
    }
    const delta = Math.round(window.innerHeight / 2);
    e.preventDefault();
    window.scrollBy(0, key === "j" ? delta : -delta);
  });

  // ? — toggle a minimal hint overlay. Badges are derived from the hint
  // titles this site already maintains (a trailing "(x)" group, or several
  // slash-separated keys like "(Space/F)"), so the overlay can never drift
  // from the live bindings. Covers links, buttons, search inputs, plant
  // toggles, and in-page players. ? again closes; Esc keeps its existing meaning (grid return /
  // up-nav) and header links keep their "(Esc)" hint titles. Scroll, resize,
  // and search re-renders share one rAF-throttled repaint while open
  // (listeners attached only while open); search arrives via the
  // keybind-hints:changed event dispatched by bindDigitNav's refresh().
  // Mobile: onKey is inert there, and no "(x)" titles exist anyway.
  let overlayEl = null;
  let overlayScrollHandler = null;
  let overlayResizeHandler = null;
  let overlayHintsHandler = null;

  function closeOverlay() {
    if (!overlayEl) {
      return;
    }
    overlayEl.remove();
    overlayEl = null;
    document.removeEventListener("scroll", overlayScrollHandler);
    window.removeEventListener("resize", overlayResizeHandler);
    document.removeEventListener("keybind-hints:changed", overlayHintsHandler);
    overlayScrollHandler = null;
    overlayResizeHandler = null;
    overlayHintsHandler = null;
  }

  function badgeAnchor(el) {
    // Image links (photo grid) badge the visible thumbnail, not the full
    // link box: the <a> is a square flex cell while the picture inside is
    // narrower (portrait) or shorter (landscape), so a cell-anchored badge
    // lands detached in the grid gutter. In-page players (video grid/single
    // after play starts) badge the player itself. Plant toggles badge to the
    // LEFT of the marker: the handle is only 2ch wide at the line's left
    // edge, so a right-side badge would sit on top of the taxa name. Text
    // links, buttons, and inputs badge just outside top-right.
    const img = el.querySelector ? el.querySelector("img") : null;
    if (img) {
      const imgRect = img.getBoundingClientRect();
      if (imgRect.width > 0 && imgRect.height > 0) {
        return { rect: imgRect, inside: true };
      }
    }
    if (el.tagName === "VIDEO" || el.tagName === "IFRAME") {
      return { rect: el.getBoundingClientRect(), inside: true };
    }
    if (el.classList && el.classList.contains("toggle")) {
      return { rect: el.getBoundingClientRect(), inside: false, side: "left" };
    }
    return { rect: el.getBoundingClientRect(), inside: false, side: "right" };
  }

  // Key tokens from a hint title. One element can advertise several keys in
  // a single trailing group — "Play (Space/F)" badges SPACE + F, a search
  // box ending "focus (/)" badges /, plant toggles ending "(!)" badge ! —
  // so the tooltip stays compact while each key stays discoverable. Only
  // the trailing group parses, so incidental parens elsewhere never badge.
  function hintKeys(el) {
    const match = (el.getAttribute("title") || "").match(/\(([-+!@#$%^&*()a-z0-9/]+(?:\/[-+!@#$%^&*()a-z0-9/]+)*)\)\s*$/i);
    if (!match) {
      return [];
    }
    // "/" is both a key and the multi-key separator — a group that is only
    // "/" means the slash key itself, not an empty key list.
    if (match[1] === "/") {
      return ["/"];
    }
    return match[1].split("/");
  }

  function buildBadges() {
    const hinted = document.querySelectorAll(
      "a[title], button[title], input[title], .toggle[title], video[title], iframe[title]",
    );
    for (const el of Array.from(hinted)) {
      const keys = hintKeys(el);
      if (!keys.length || !isFullyInViewport(el)) {
        continue;
      }
      const { rect, inside, side } = badgeAnchor(el);
      keys.forEach((key, i) => {
        const badge = document.createElement("span");
        badge.className = "keybind-hint-badge";
        // Single letters keep their case so (d) lossy and (D) lossless stay
        // distinct; longer names uppercase (Esc → ESC) as before.
        badge.textContent = key.length > 1 ? key.toUpperCase() : key;
        overlayEl.appendChild(badge);
        // Position after append so the badge's own box doesn't affect it.
        // The overlay is position:fixed, so viewport-relative rect coords are
        // used directly (no scroll offsets). Image/player badges sit inside
        // the thumbnail's top-left corner (extras stack below); text badges
        // sit just outside top-right; toggle badges hang left of the marker
        // (translateX(-100%) right-aligns without measuring the badge, so
        // the taxa name stays uncovered).
        if (inside) {
          badge.style.left = `${rect.left + 4}px`;
          badge.style.top = `${rect.top + 4 + i * 22}px`;
        } else if (side === "left") {
          badge.style.left = `${rect.left - 2}px`;
          badge.style.top = `${rect.top - 4 + i * 22}px`;
          badge.style.transform = "translateX(-100%)";
        } else {
          badge.style.left = `${rect.right + 2}px`;
          badge.style.top = `${rect.top - 4 + i * 22}px`;
        }
      });
    }
  }

  function openOverlay() {
    overlayEl = document.createElement("div");
    overlayEl.className = "keybind-hint-overlay";
    overlayEl.setAttribute("aria-hidden", "true");
    document.body.appendChild(overlayEl);
    let rafPending = false;
    const scheduleRepaint = () => {
      // One shared throttle for scroll, resize, and search-driven hint
      // changes: a single scroll frame otherwise repaints twice (the scroll
      // listener here plus bindDigitNav's refresh → keybind-hints:changed).
      // The guard also covers ? closing between scheduling and the frame so
      // a late event can't resurrect badges onto a closed overlay.
      if (rafPending) {
        return;
      }
      rafPending = true;
      const raf = window.requestAnimationFrame || ((fn) => setTimeout(fn, 0));
      raf(() => {
        rafPending = false;
        if (!overlayEl) {
          return;
        }
        overlayEl.innerHTML = "";
        buildBadges();
      });
    };
    overlayScrollHandler = scheduleRepaint;
    overlayResizeHandler = scheduleRepaint;
    // Search re-renders update digit-nav titles via bindDigitNav's refresh()
    // (keybind-utils.js), which dispatches this event.
    overlayHintsHandler = scheduleRepaint;
    document.addEventListener("scroll", overlayScrollHandler, { passive: true });
    window.addEventListener("resize", overlayResizeHandler);
    document.addEventListener("keybind-hints:changed", overlayHintsHandler);
    buildBadges();
  }

  onKey("?", () => {
    if (overlayEl) {
      closeOverlay();
    } else {
      openOverlay();
    }
  });
}());
</script>
